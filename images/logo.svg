<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#855806" />
    </linearGradient>
    
    <!-- Red Accent Gradient -->
    <linearGradient id="crimsonLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON MEDALLION (LEFT) -->
  <g transform="translate(6, 5)">
    <!-- Outer Oval Ring -->
    <ellipse cx="30" cy="30" rx="28" ry="24" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" />
    <ellipse cx="30" cy="30" rx="25.5" ry="21.5" fill="#0B0C10" fill-opacity="0.6" stroke="rgba(212,175,55,0.3)" stroke-width="1" />

    <!-- Stylized 'A' with Left Eye -->
    <path d="M19 19 Q25 15 28 35 M19 19 Q14 26 12 35 M14 29 Q21 27 26 29" 
          fill="none" stroke="url(#crimsonLinear)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Left Eye Pupil -->
    <ellipse cx="19.5" cy="32" rx="4.5" ry="3" fill="url(#crimsonLinear)" />
    <circle cx="19.5" cy="32" r="1.8" fill="#FFFFFF" />
    <circle cx="19.5" cy="32" r="0.9" fill="#0B0C10" />

    <!-- Stylized 'S' with Right Eye -->
    <path d="M42 19 C40 15, 33 15, 33 22 C33 28, 43 28, 43 36 C43 43, 33 43, 31 38" 
          fill="none" stroke="url(#crimsonLinear)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Eye Pupil -->
    <ellipse cx="37.5" cy="32" rx="4.5" ry="3" fill="url(#crimsonLinear)" />
    <circle cx="37.5" cy="32" r="1.8" fill="#FFFFFF" />
    <circle cx="37.5" cy="32" r="0.9" fill="#0B0C10" />
  </g>

  <!-- BRAND TYPOGRAPHY (RIGHT) -->
  <!-- 'ADRIAN SAINT' -->
  <text x="74" y="36" font-family="'Outfit', 'Montserrat', sans-serif" font-size="24" font-weight="900" letter-spacing="0.08em">
    <tspan fill="url(#crimsonLinear)">ADRIAN</tspan>
    <tspan fill="url(#goldLinear)" dx="6">SAINT</tspan>
  </text>

  <!-- Subtitle Separator Lines & Text -->
  <line x1="75" y1="48" x2="105" y2="48" stroke="url(#goldLinear)" stroke-width="1.2" stroke-opacity="0.7" />
  <text x="112" y="51" font-family="'Outfit', 'Montserrat', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.22em" fill="#E2E8F0">
    CORPORATE MENTALIST
  </text>
  <line x1="285" y1="48" x2="315" y2="48" stroke="url(#goldLinear)" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Tagline -->
  <text x="114" y="62" font-family="'Outfit', 'Montserrat', sans-serif" font-size="7.5" font-weight="600" font-style="italic" letter-spacing="0.12em" fill="url(#goldLinear)">
    MIND STIMULATING ENTERTAINMENT
  </text>
</svg>
