<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150">
  <!-- 100% TRANSPARENT BACKGROUND (NO WHITE BOX) -->
  
  <!-- 1. TOP OVAL ICON -->
  <g transform="translate(190, 36)">
    <!-- Outer White Oval Ring -->
    <ellipse cx="0" cy="0" rx="58" ry="32" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
    <ellipse cx="0" cy="0" rx="54" ry="28" fill="none" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5" />
    
    <!-- Stylized 'A' (Left) with Eye -->
    <path d="M-34,16 C-30,0 -16,-20 -7,-20 C-1,-20 2,-6 3,16" fill="none" stroke="#EF4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-32,7 Q-17,-2 -2,7" fill="none" stroke="#EF4444" stroke-width="3.8" stroke-linecap="round" />
    <!-- Left Eye -->
    <ellipse cx="-17" cy="12" rx="7" ry="5" fill="#EF4444" />
    <circle cx="-17" cy="12" r="3" fill="#FFFFFF" />
    <circle cx="-17" cy="12" r="1.5" fill="#09090B" />

    <!-- Stylized 'S' (Right) with Eye -->
    <path d="M26,-16 C21,-22 7,-18 7,-7 C7,6 27,4 27,16 C27,24 14,24 8,18" fill="none" stroke="#EF4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M4,7 Q18,1 31,7" fill="none" stroke="#EF4444" stroke-width="3.8" stroke-linecap="round" />
    <!-- Right Eye -->
    <ellipse cx="17" cy="12" rx="7" ry="5" fill="#EF4444" />
    <circle cx="17" cy="12" r="3" fill="#FFFFFF" />
    <circle cx="17" cy="12" r="1.5" fill="#09090B" />
  </g>

  <!-- 2. MAIN LOGO TEXT 'ADRIAN SAINT' -->
  <text x="190" y="98" text-anchor="middle" font-family="'Cinzel', 'Outfit', 'Times New Roman', serif" font-size="34" font-weight="900" letter-spacing="0.12em">
    <tspan fill="#EF4444">ADRIAN</tspan>
    <tspan fill="#FFFFFF" dx="10">SAINT</tspan>
  </text>

  <!-- 3. SUBTITLE '— MENTALIST | ENTERTAINER —' -->
  <text x="190" y="118" text-anchor="middle" font-family="'Outfit', 'Montserrat', 'Arial', sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.26em" fill="#FFFFFF">
    — MENTALIST | ENTERTAINER —
  </text>

  <!-- 4. TAGLINE 'Mind Stimulating Entertainment' -->
  <text x="190" y="138" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" font-size="12.5" font-weight="700" letter-spacing="0.05em" fill="#EF4444">
    Mind Stimulating Entertainment
  </text>
</svg>
