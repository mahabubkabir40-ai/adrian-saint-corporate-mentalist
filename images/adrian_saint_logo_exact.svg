<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" width="380" height="160">
  <rect width="100%" height="100%" fill="#FFFFFF" rx="12" />
  
  <!-- 1. TOP OVAL ICON -->
  <g transform="translate(190, 42)">
    <!-- Outer Black Oval -->
    <ellipse cx="0" cy="0" rx="60" ry="34" fill="none" stroke="#111111" stroke-width="5.5" />
    
    <!-- Stylized 'A' (Left) with Eye -->
    <!-- 'A' Left leg and Apex -->
    <path d="M-36,18 C-32,0 -16,-22 -7,-22 C-1,-22 2,-6 3,18" fill="none" stroke="#BA141A" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 'A' Crossbar / Eye brow curve -->
    <path d="M-34,8 Q-18,-2 -2,8" fill="none" stroke="#BA141A" stroke-width="4" stroke-linecap="round" />
    <!-- Left Eye Ball & Pupil -->
    <ellipse cx="-18" cy="14" rx="7.5" ry="5.5" fill="#BA141A" />
    <circle cx="-18" cy="14" r="3.2" fill="#FFFFFF" />
    <circle cx="-18" cy="14" r="1.6" fill="#111111" />

    <!-- Stylized 'S' (Right) with Eye -->
    <!-- 'S' Spine & Tail -->
    <path d="M28,-18 C22,-24 7,-20 7,-8 C7,6 29,4 29,18 C29,26 15,26 9,20" fill="none" stroke="#BA141A" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 'S' Eye brow curve -->
    <path d="M4,9 Q19,2 33,9" fill="none" stroke="#BA141A" stroke-width="4" stroke-linecap="round" />
    <!-- Right Eye Ball & Pupil -->
    <ellipse cx="18" cy="14" rx="7.5" ry="5.5" fill="#BA141A" />
    <circle cx="18" cy="14" r="3.2" fill="#FFFFFF" />
    <circle cx="18" cy="14" r="1.6" fill="#111111" />
  </g>

  <!-- 2. MAIN LOGO TEXT 'ADRIAN SAINT' -->
  <text x="190" y="108" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="0.12em">
    <tspan fill="#BA141A">ADRIAN</tspan>
    <tspan fill="#111111" dx="10">SAINT</tspan>
  </text>

  <!-- 3. SUBTITLE '— MENTALIST | ENTERTAINER —' -->
  <text x="190" y="128" text-anchor="middle" font-family="'Montserrat', 'Arial', sans-serif" font-size="12" font-weight="700" letter-spacing="0.24em" fill="#111111">
    — MENTALIST | ENTERTAINER —
  </text>

  <!-- 4. TAGLINE 'Mind Stimulating Entertainment' -->
  <text x="190" y="148" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" font-size="13" font-weight="600" letter-spacing="0.04em" fill="#BA141A">
    Mind Stimulating Entertainment
  </text>
</svg>
